# Opt-in override that turns Xdebug step-debugging on for the php service.
# The image ships with xdebug.mode=off so that every PHP process (tests,
# console) runs without Xdebug overhead.
#
# Use when you need to step-debug (map /var/www/html to the project root in the IDE):
#   make up-xdebug
#
# These keys are merged with the base file (compose merges by key, the later
# file wins).
services:
  php:
    # start_with_request is not read from XDEBUG_CONFIG: without it, Xdebug waits
    # for a trigger (XDEBUG_SESSION cookie/parameter) and never connects. It is set
    # for PHP-FPM only, by a pool file: the console keeps the trigger mode
    # (XDEBUG_TRIGGER=1 to debug a command).
    volumes:
      - ./docker/php-fpm/xdebug-fpm.conf:/usr/local/etc/php-fpm.d/zz-xdebug.conf:ro
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
      # PhpStorm picks the server (and its path mappings) by this name instead of
      # SERVER_NAME + SERVER_PORT: the port seen by PHP depends on the entry point.
      - PHP_IDE_CONFIG=serverName=api-dev.episciences.org
    extra_hosts:
      - "host.docker.internal:host-gateway"
